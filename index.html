<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Dos · Últimas noticias</title>
  <meta name="description" content="Las últimas noticias de Radio Dos (FM 99.3, Corrientes). Tocá una placa para leer la noticia completa.">
  <meta name="theme-color" content="#e0092d">

  <!-- Open Graph: cómo se ve el link al compartirlo -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Radio Dos · Últimas noticias">
  <meta property="og:description" content="Tocá una placa para leer la noticia completa en radiodos.com.ar">
  <meta property="og:image" content="logo.png">

  <link rel="icon" href="logo.png">

  <!-- Umami: analytics sin cookies. Mide visitas + el evento "click-nota" por placa. -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="1b162651-6c1c-4743-928e-a4b55f12cb62"></script>

  <style>
    :root {
      --rojo: #e0092d;
      --rojo-oscuro: #a80022;
      --negro: #0a0a0a;
      --gris: #6b6b70;
      --linea: #ececef;
      --fondo: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--fondo);
      color: var(--negro);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .top-bar { height: 5px; background: var(--rojo); }
    .wrap { max-width: 600px; margin: 0 auto; padding: 18px 16px 40px; }

    .seccion-titulo {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--gris); margin: 6px 0 16px;
    }
    .seccion-titulo::before, .seccion-titulo::after {
      content: ""; flex: 1; height: 1px; background: var(--linea);
    }

    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .tile {
      display: block; position: relative; overflow: hidden;
      border-radius: 10px; background: #f2f2f4; aspect-ratio: 4 / 5;
      transition: transform .12s ease, box-shadow .15s ease;
    }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.14); }
    .tile::after {
      content: ""; position: absolute; inset: 0; border-radius: 10px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
    }

    .estado {
      text-align: center; color: var(--gris); font-size: 15px;
      padding: 48px 16px; line-height: 1.5;
    }
    .spinner {
      width: 26px; height: 26px; margin: 0 auto 14px;
      border: 3px solid var(--linea); border-top-color: var(--rojo);
      border-radius: 50%; animation: giro .8s linear infinite;
    }
    @keyframes giro { to { transform: rotate(360deg); } }

    @media (max-width: 360px) { .grid { gap: 6px; } }
  </style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="wrap">
    <div class="seccion-titulo">Últimas noticias</div>

    <div id="estado" class="estado">
      <div class="spinner"></div>
      Cargando las últimas noticias…
    </div>
    <div id="grid" class="grid" hidden></div>
  </div>

  <script>
    (function () {
      var grid = document.getElementById("grid");
      var estado = document.getElementById("estado");

      function mostrarEstado(texto) {
        estado.hidden = false;
        estado.textContent = texto;
        grid.hidden = true;
      }

      function render(posts) {
        if (!Array.isArray(posts) || posts.length === 0) {
          mostrarEstado("Muy pronto vas a ver acá las últimas noticias de Radio Dos.");
          return;
        }
        var frag = document.createDocumentFragment();
        posts.forEach(function (p) {
          if (!p || !p.url || !p.image) return;
          var a = document.createElement("a");
          a.className = "tile";
          a.href = p.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.setAttribute("data-umami-event", "click-nota");
          a.setAttribute("data-umami-event-titulo", p.title || "Nota");
          var img = document.createElement("img");
          img.src = p.image;
          img.alt = p.title || "Noticia de Radio Dos";
          img.loading = "lazy";
          img.decoding = "async";
          a.appendChild(img);
          frag.appendChild(a);
        });
        grid.innerHTML = "";
        grid.appendChild(frag);
        estado.hidden = true;
        grid.hidden = false;
      }

      fetch("posts.json?v=" + Date.now(), { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (data) { render(data && data.posts); })
        .catch(function () {
          mostrarEstado("No pudimos cargar las noticias ahora. Volvé a entrar en un ratito.");
        });

      // Auto-alto: le avisa al contenedor (la página /instagram) cuánto mide, para que ajuste
      // el alto del iframe y no quede ni scroll interno ni espacio en blanco. Inofensivo fuera
      // de un iframe (el postMessage va a la propia ventana y nadie lo escucha).
      function postHeight() {
        var h = document.documentElement.scrollHeight;
        parent.postMessage({ type: "rd-bio-height", height: h }, "*");
      }
      if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
      window.addEventListener("load", postHeight);
    })();
  </script>
</body>
</html>
